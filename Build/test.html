<!-- This is an example of how a HTML Template works, the compiler replaces <h1>My Markdown Title</h1>
<h2>My Smaller Markdown Title</h2>
<h3>Smaller</h3>
<p>Test Markdown Document</p>
<p><em>Italic Text</em></p>
<p><strong>Bold Text</strong></p>
<pre><code>Code Block
</code></pre>
<p><code>Single Code Line</code></p>
 with the actual HTML generated for the Documentation Page. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Page Title</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
            color: #333;
        }
        h1 {
            color: #007acc;
        }
    </style>
</head>
<body>
    <h1>Example Page HTML Template</h1>
    <h1>My Markdown Title</h1>
<h2>My Smaller Markdown Title</h2>
<h3>Smaller</h3>
<p>Test Markdown Document</p>
<p><em>Italic Text</em></p>
<p><strong>Bold Text</strong></p>
<pre><code>Code Block
</code></pre>
<p><code>Single Code Line</code></p>

</body>
</html>
