<!-- This is an example of how a HTML Template works.
the compiler replaces {{HTML_DOCUMENTATION}} with the actual HTML generated for the Documentation Page.
the compiler replaces {{DOCUMENTATION_TITLE}} with the name of the Documentation Page.
the compiler replaces {{NAVBAR}} with the HTML generated from the NavBar -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{DOCUMENTATION_TITLE}}</title>
    <script
      src="https://kit.fontawesome.com/b35cf919df.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="page_styles.css" />
  </head>
  <body>
    <nav class="nav-bar collapsible">
      <a href="/" class="nav__logo">{{DOCUMENTATION_TITLE}}</a>

      <svg class="nav__menu-icon">
        <use href="../Icons/sprite.svg#menu"></use>
      </svg>
      <ul class="collapsible__content">
        <li class="nav__title">
          Title 1
          <ul class="nav__list">
            <li class="nav__list-item">Page Link 1</li>
            <li class="nav__list-item">Page Link 2</li>
            <li class="nav__list-item">Page Link 3</li>
            <li class="nav__list-item">Page Link 4</li>
          </ul>
        </li>
        <li class="nav__title">
          Title 2
          <ul class="nav__list">
            <li class="nav__list-item">Page Link 1</li>
            <li class="nav__list-item">Page Link 2</li>
            <li class="nav__list-item">Page Link 3</li>
            <li class="nav__list-item">Page Link 4</li>
          </ul>
        </li>
      </ul>
    </nav>
    <script src="main.js"></script>
  </body>
</html>
