<!-- This is an example of how a HTML Template works.
the compiler replaces {{HTML_DOCUMENTATION}} with the actual HTML generated for the Documentation Page.
the compiler replaces {{DOCUMENTATION_TITLE}} with the name of the Documentation Page.
the compiler replaces {{NAVBAR}} with the HTML generated from the NavBar -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{DOCUMENTATION_TITLE}}</title>
    <script
      src="https://kit.fontawesome.com/b35cf919df.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="styles_defualt.css" />
  </head>
  <body>
    <div class="grid grid--cols-2">
      <nav class="nav collapsible">
        <a class="nav__heading" href="###HOME PAGE###"
          >{{DOCUMENTATION_TITLE}}</a
        >
        <svg class="nav__menu-icon">
          <use href="../Icons/sprite.svg#menu"></use>
        </svg>
        {{NAVBAR}}
      </nav>
      <section class="content">
        <div class="container">{{HTML_DOCUMENTATION}}</div>
      </section>
    </div>
    <script src="main.js"></script>
  </body>
</html>
