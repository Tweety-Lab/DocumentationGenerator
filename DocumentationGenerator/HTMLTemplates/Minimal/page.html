<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{DOCUMENTATION_TITLE}}</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 
                         Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', 
                         sans-serif;
        }

        code {
            background-color: #f1f1f1;
            padding: 4px;
            border-radius: 2px;
        }

        h1, h2, h3, h4, h5, h6 {
            color: #1b1b1b;
        }

        /* Watermark */
        .watermark {
            margin-top: 100px;
            color:#dbdbdb;
            border-top: 1px solid #dbdbdb; /* Horizontal line */
            padding-top: 0px;
            width: 50%;
        }

        .watermark a {
            color: #9eb1c4;
        }
    </style>
</head>
<body>
    {{NAVBAR}}
    {{HTML_DOCUMENTATION}}

    <!-- Watermark -->
    <div class="watermark">
        <p>Site Built with <a href="https://github.com/Tweety-Lab/DocumentationGenerator">Documentation Generator</a></p>
    </div>
</body>
</html>
