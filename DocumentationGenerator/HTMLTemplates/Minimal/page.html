<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Highlight.js CSS theme -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
    />

    <!-- Highlight.js JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{DOCUMENTATION_TITLE}}</title>
    <style>
      html {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      }

      body {
        margin: 0;
        margin-right: 700px;
      }

      code {
        background-color: #f1f1f1;
        padding: 4px;
        border-radius: 2px;
      }

      pre code {
        font-family: monospace;
        padding: 8px;
        border-radius: 4px;
        border: 1px solid #ddd;
        display: inline-block;
        width: 100%;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        color: #1b1b1b;
      }

      table {
        border-collapse: collapse;
        margin: 1em 0;
        font-size: 0.95em;
        width: auto; /* Make table as wide as its content */
        max-width: 100%;
      }


      a {
        color: #264d74;
      }

      table thead {
        background-color: #f6f8fa;
      }

      table th,
      table td {
        border: 1px solid #dfe2e5;
        padding: 8px 12px;
        text-align: left;
      }

      table tr:nth-child(even) {
        background-color: #fafafa;
      }

      table th {
        font-weight: 600;
      }

      ul li::marker {
        color:#383838
      }

      .current-page {
        color: rgb(97, 97, 97);
      }

      .current-page span {
        color: rgb(61, 61, 61);
        font-weight: 500;
      }

      /* Watermark */
      .watermark {
        margin-top: 100px;
        color: #dbdbdb;
        font-size: 1rem;
        border-top: 1px solid #e9e9e9; /* Horizontal line */
        padding-top: 0px;
        width: 100%; /* Take up whole footer path */
      }

      .watermark a {
        color: #9eb1c4;
      }
    </style>
    <script>
      // Initialize highlight.js on page load
      document.addEventListener("DOMContentLoaded", () => {
        hljs.highlightAll();
      });
    </script>
  </head>
  <body>
    <p class="current-page">Site / <span>{{DOCUMENTATION_TITLE}}</span></p>
    {{NAVBAR}} {{HTML_DOCUMENTATION}}

    <!-- Watermark -->
    <div class="watermark">
      <p>
        Site Built with
        <a href="https://github.com/Tweety-Lab/DocumentationGenerator"
          >Documentation&nbsp;Generator</a
        >
      </p>
    </div>
  </body>
</html>
