<head>
    <style>
        body {
            padding-left: 210px; /* Push content right for navbar width */
        }

        .navbar {
            color: white;
            background-color: #2b2b2b;
            width: 140px;
            height: 100%;
            position: fixed;
            left: 0;
            top: 0;
            padding: 20px;
            margin: 0;
        }

        .navbar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .navbar li {
            padding: 0;
            margin: 0;
        }

        .navbar li.nav__title {
            color:rgb(255, 255, 255);
            font-weight: bold;
            font-size: 1em;
            margin-bottom: 10px;
        }

        .navbar li.nav__list-item {
            color:rgb(255, 255, 255);
            font-weight: normal;
            font-size: 0.9em;
            margin: 8px 0;
            margin-left: 15px;
        }

        .navbar li.nav__list-item a {
            color: inherit;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="navbar">
        {{NAVBAR_CONTENT}}
    </div>
</body>
