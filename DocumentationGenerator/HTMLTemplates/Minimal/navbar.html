<head>
    <style>
        body {
            padding-left: 150px; /* Push content right for navbar width */
        }
        
        .navbar {
            color: white; /* Default Text Color */
            background-color: #2b2b2b; /* Background Color */
            width: 130px; /* Width of the NavBar body */
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
        }

        .navbar ul {
            list-style: none; /* Remove bullets */
            padding: 0;
            margin: 0;
            font-weight: bold; /* Like a heading */
            font-size: 1.3em; /* Slightly larger */
            margin-bottom: 10px; /* Spacing after "title" */
        }
        .navbar li {
            font-weight: normal;
            font-size: 0.8em;
            margin: 8px 0; /* Spacing like paragraphs */
            padding-left: 10px; /* Indent slightly */
        }

        .navbar li a {
            color: inherit;         /* Uses parent's text color */
            text-decoration: none;  /* Remove underline */
        }  
    </style>
</head>
<body>
    <div class="navbar">
        {{NAVBAR_CONTENT}}
    </div>
</body>
