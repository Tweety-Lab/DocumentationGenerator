<!-- This is an example of how a HTML Template works.
 the compiler replaces {{HTML_DOCUMENTATION}} with the actual HTML generated for the Documentation Page.
 the compiler replaces {{DOCUMENTATION_TITLE}} with the name of the Documentation Page. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{DOCUMENTATION_TITLE}}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
            color: #333;
        }
        h1 {
            color: #007acc;
        }
    </style>
</head>
<body>
    <!-- The Navbar should be added at the top of <body> -->
    {{NAVBAR}}

    <!-- Page Contents -->
    <h1>Example Page HTML Template</h1>
    {{HTML_DOCUMENTATION}}
</body>
</html>
