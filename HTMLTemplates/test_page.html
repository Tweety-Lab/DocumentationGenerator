<!-- This is an example of how a HTML Template works, the compiler replaces {{HTML_DOCUMENTATION}} with the actual HTML generated for the Documentation Page. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Page Title</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
            color: #333;
        }
        h1 {
            color: #007acc;
        }
    </style>
</head>
<body>
    <h1>Example Page HTML Template</h1>
    {{HTML_DOCUMENTATION}}
</body>
</html>
